# Heap sized for the 8 GB reference machine used for release builds.
# The previous -Xmx8G/-XX:MaxMetaspaceSize=4G requested more memory than the
# machine has (only ~0.5 GB free while Flutter/Dart run), which killed the
# Gradle daemon mid-build on `assembleRelease` ("Gradle build daemon
# disappeared unexpectedly"). Raise this again only on machines with plenty
# of headroom.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is disabled because it fails on this
# toolchain: `:android_file_picker:compileDebugKotlin` aborts with
# "Could not close incremental caches ... class-fq-name-to-source.tab"
# inside the file_picker plugin's build directory. The failure is in the
# plugin's Kotlin compile, not in Gochano's Dart or Android code, and it
# reproduces from a clean build directory with no Gradle daemon running.
#
# Turning incremental compilation off costs some rebuild time and makes the
# build deterministic. Revisit when file_picker or the Kotlin Gradle plugin
# is next upgraded.
kotlin.incremental=false
