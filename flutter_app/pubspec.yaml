name: gochano

description: Gochano — organize study and daily life in one place.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0

  http: ^1.6.0

  file_picker: ^12.0.0
  image_picker: ^1.2.3

  pdfrx: ^2.4.7

  intl: ^0.20.3

  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  flutter_map: ^8.3.1
  latlong2: ^0.10.0
  geolocator: ^14.0.3

  path_provider: ^2.1.5
  open_filex: ^4.5.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  image_path: "assets/branding/Gochano.png"
  android: true
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0F1115"
  image: "assets/branding/Gochano.png"
  color_dark: "#0F1115"
  image_dark: "assets/branding/Gochano.png"
  android_12:
    color: "#0F1115"
    image: "assets/branding/Gochano.png"
  fullscreen: true
  android_gravity: center
  ios: false
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/branding/Gochano.png