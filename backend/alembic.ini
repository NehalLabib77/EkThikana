# A generic, single-database Alembic configuration for Gochano's PostgreSQL
# CommuteBD dataset.
#
# Phase 2 of the migration moves the canonical Supabase dataset into a
# Postgres-only flow.  This file is intentionally minimal: the actual
# connection URL is read from ``DATABASE_URL`` via ``env.py`` so the same
# configuration works for local ``.env``, CI, and Render.

[alembic]
script_location = alembic
prepend_sys_path = .
# Migrations are timestamped for readability.  Existing files in
# ``backend/migrations`` use a sequential prefix and stay untouched.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC
truncate_slug_length = 40

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
