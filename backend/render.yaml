# Existing technical service name retained for deployment compatibility.
# User-facing brand is Gochano; renaming this service is optional.
services:
  - type: web
    name: ekthikana-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: ""
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_B64
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: ekthikana-files
      - key: DATABASE_URL
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_ENDPOINT_URL
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        # Must name a model your API key can actually call. `gemini-3.7-flash`
        # was set here and is not a real model, so every AI request came back
        # as a provider error. Keep this in step with the default in
        # app/core/config.py.
        value: gemini-2.5-flash
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: USER_STORAGE_LIMIT_MB
        value: "100"
      - key: UPLOAD_DAILY_LIMIT
        value: "10"
      - key: SIGNED_URL_TTL_SECONDS
        value: "900"
      - key: AI_DAILY_LIMIT
        value: "30"
      - key: ROUTING_PROVIDER
        value: osrm
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: NOMINATIM_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: ROUTING_USER_AGENT
        sync: false
      - key: COMMUTE_ML_MIN_TOTAL_REPORTS
        value: "500"
      - key: COMMUTE_ML_MIN_MODE_REPORTS
        value: "150"
